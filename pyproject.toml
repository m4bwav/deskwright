[project]
name = "deskwright"
version = "0.3.0"
description = "See and drive a desktop from a shell: screenshots, clicks, keys, windows. Windows, macOS, Linux/X11."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["mss>=9", "pillow>=10", "pynput>=1.7", "pywinctl>=0.4"]

[project.scripts]
desk = "desk:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["desk"]
